<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Pedidos - Disfrazate.cl</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@600;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .admin-header {
            background-color: var(--bg-dark);
            border-bottom: 2px solid var(--border-color);
            padding: 15px 0;
        }
        .admin-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-title-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .admin-icon {
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .admin-title-text h1 {
            font-family: var(--font-header);
            font-size: 1.5rem;
            font-weight: 900;
        }
        .admin-title-text p {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
        }
        .btn-back {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background var(--transition-fast);
        }
        .btn-back:hover {
            background: var(--border-color);
        }
        .pedidos-main {
            flex: 1;
            margin-top: 30px;
        }
        .orders-table-wrapper {
            margin-top: 25px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .no-orders-box {
            text-align: center;
            padding: 60px 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .no-orders-box i {
            margin-bottom: 15px;
            color: var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Admin Top Nav Header -->
    <header class="admin-header">
        <div class="container admin-header-container">
            <div class="admin-title-area">
                <div class="admin-icon">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
                <div class="admin-title-text">
                    <h1>Módulo de Pedidos</h1>
                    <p>Despachos Pendientes</p>
                </div>
            </div>
            
            <a href="index.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Volver a la Tienda
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="pedidos-main container">
        <h2 class="section-title">Pedidos por Despachar</h2>
        
        <div class="orders-table-wrapper">
            <table class="pedidos-table" id="pedidos-table">
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Comuna</th>
                        <th>Dirección</th>
                        <th>Productos</th>
                        <th>Total</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="pedidos-body">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
            
            <div class="no-orders-box" id="no-pedidos-msg" style="display: none;">
                <i class="fa-regular fa-folder-open fa-3x"></i>
                <p>No hay pedidos pendientes de despacho por el momento.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer" style="margin-top: 60px;">
        <div class="footer-bottom">
            <p>&copy; 2026 Disfrazate.cl - Panel de Control Interno.</p>
        </div>
    </footer>

    <!-- Scripting logic for pending orders -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchPedidos();
        });

        async function fetchPedidos() {
            try {
                const response = await fetch('/api/pedidos');
                const list = await response.json();
                renderPedidosList(list);
            } catch (err) {
                console.warn("Server API offline, loading from localStorage fallback:", err);
                // Fallback for standalone/client demonstrations
                const fallbackList = JSON.parse(localStorage.getItem('pedidosPendientes')) || [];
                renderPedidosList(fallbackList);
            }
        }

        function renderPedidosList(pedidos) {
            const table = document.getElementById('pedidos-table');
            const tbody = document.getElementById('pedidos-body');
            const emptyBox = document.getElementById('no-pedidos-msg');

            tbody.innerHTML = '';

            if (pedidos.length === 0) {
                table.style.display = 'none';
                emptyBox.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            emptyBox.style.display = 'none';

            // Show newest orders on top
            const reversedOrders = [...pedidos].reverse();

            reversedOrders.forEach(p => {
                let itemsHtml = '<ul style="margin: 0; padding-left: 15px; font-size: 0.85rem; text-align: left;">';
                p.items.forEach(item => {
                    const attr = item.flavor ? ` <span style="color: var(--accent);">(${item.flavor})</span>` : '';
                    itemsHtml += `<li>${item.quantity}x ${item.name}${attr}</li>`;
                });
                itemsHtml += '</ul>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${p.id}</strong></td>
                    <td style="font-size: 0.85rem; color: var(--text-gray);">${p.date}</td>
                    <td>
                        <strong>${p.customerName}</strong><br>
                        <span style="font-size: 0.8rem; color: var(--text-muted);"><i class="fa-solid fa-phone"></i> ${p.customerPhone || 'N/A'}</span>
                    </td>
                    <td><span class="mini-logo-overlay" style="position:static; padding: 2px 6px;">${p.customerCommune || 'RM'}</span></td>
                    <td style="font-size: 0.85rem;">${p.customerAddress}</td>
                    <td>${itemsHtml}</td>
                    <td style="color: var(--accent); font-weight: 800; font-size: 1.1rem;">$${p.total.toLocaleString('es-CL')}</td>
                    <td>
                        <button class="btn-despachar" onclick="dispatchOrder('${p.id}')">
                            <i class="fa-solid fa-truck-ramp-box"></i> Despachar
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function dispatchOrder(orderId) {
            if (!confirm(`¿Estás seguro de marcar el pedido ${orderId} como DESPACHADO?\nEsta acción lo registrará como venta concretada.`)) {
                return;
            }

            try {
                const response = await fetch('/api/despachar-pedido', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: orderId })
                });
                const data = await response.json();
                if (data.success) {
                    alert(`¡Pedido ${orderId} despachado con éxito!`);
                    fetchPedidos();
                } else {
                    alert('Error en el servidor al despachar el pedido: ' + data.error);
                }
            } catch (err) {
                console.warn("Server API offline, executing local dispatch fallback:", err);
                
                // Fallback local storage manipulation
                let localPedidos = JSON.parse(localStorage.getItem('pedidosPendientes')) || [];
                const idx = localPedidos.findIndex(p => p.id === orderId);
                
                if (idx !== -1) {
                    const dispatched = localPedidos.splice(idx, 1)[0];
                    localStorage.setItem('pedidosPendientes', JSON.stringify(localPedidos));

                    // Move to local sales history
                    let localSales = JSON.parse(localStorage.getItem('ventasLocales')) || [];
                    dispatched.date = new Date().toLocaleString('es-CL');
                    dispatched.isoDate = new Date().toISOString();
                    localSales.push(dispatched);
                    localStorage.setItem('ventasLocales', JSON.stringify(localSales));

                    alert(`¡Pedido ${orderId} despachado localmente (Modo Demo)!`);
                    fetchPedidos();
                } else {
                    alert('Pedido no encontrado en caché local.');
                }
            }
        }
    </script>
</body>
</html>
